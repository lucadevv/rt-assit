[project]
name = "rtassist-python"
version = "0.1.0"
description = "AI Interview Assistant Backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.1.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "mistune>=3.0",
    "trafilatura>=1.12",
    "pyjwt[crypto]>=2.10",
    "passlib>=1.7.4",
    "bcrypt<4.1",
    "cryptography>=43",
    "reportlab>=4.2",
    "apscheduler>=3.10",
    "resend>=2.5",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python-version = "3.11"
strict = true
