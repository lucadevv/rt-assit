<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rtassist - Live Transcript</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 1.5rem;
            color: #00d4ff;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #00ff88;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .transcript-section {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .transcript-box {
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            background: #0f0f23;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .speaker-1 { color: #00d4ff; }   /* Speaker 1 - Cyan */
        .speaker-2 { color: #ff6b6b; }   /* Speaker 2 - Red */
        .speaker-3 { color: #00ff88; }   /* Speaker 3 - Green */
        .speaker-4 { color: #ffaa00; }   /* Speaker 4 - Orange */
        
        .speaker-interviewer {
            color: #00d4ff;
        }

        .speaker-assistant {
            color: #ff6b6b;
        }

        .speaker-unknown {
            color: #888;
        }

        .timestamp {
            font-size: 0.7rem;
            color: #555;
            margin-right: 8px;
        }

        .response-section {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .response-box {
            min-height: 80px;
            background: #0f0f23;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            line-height: 1.6;
            color: #ff6b6b;
        }

        .thinking {
            color: #ffaa00;
            font-style: italic;
        }

        .error-box {
            background: #2a1a1a;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            color: #ff4444;
            display: none;
        }

        .error-box.visible {
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #00d4ff;
            color: #000;
        }

        .btn-primary:hover {
            background: #00b8e6;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a3e;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #888;
        }

        .info code {
            background: #0f0f23;
            padding: 2px 6px;
            border-radius: 4px;
            color: #00d4ff;
        }
        
        .info p {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ rtassist</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </header>

        <div class="transcript-section">
            <div class="section-title">Transcripción en Vivo</div>
            <div class="transcript-box" id="transcriptBox">
                <span class="speaker-unknown">Esperando audio...</span>
            </div>
        </div>

        <div class="response-section">
            <div class="section-title">Respuesta del Asistente</div>
            <div class="response-box" id="responseBox">
                <span class="thinking" id="thinkingText"></span>
            </div>
        </div>

        <div class="error-box" id="errorBox"></div>

        <div class="controls">
            <button class="btn-secondary" onclick="clearTranscript()">Limpiar</button>
            <button class="btn-primary" onclick="reconnect()">Reconectar</button>
        </div>

        <div class="info">
            <p>Conectado a: <code id="wsUrl">ws://localhost:8765</code></p>
            <p>Puertos: Overlay <code>8765</code> | Audio <code>8766</code></p>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectTimeout = null;
        
        // Default to overlay WebSocket port
        // If served via /ws proxy, use current host + /ws
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        let host = window.location.host;
        
        // If we're on the UI server (port 8080), use /ws endpoint
        // Otherwise, connect directly to overlay (port 8765/ws)
        let wsUrl;
        if (host && host.includes('8080')) {
            wsUrl = `${protocol}//${host}/ws`;
        } else if (host) {
            wsUrl = `${protocol}//${host}/ws`;
        } else {
            // Fallback for direct file access
            wsUrl = 'ws://localhost:8765/ws';
        }
        
        document.getElementById('wsUrl').textContent = wsUrl;

        const transcriptBox = document.getElementById('transcriptBox');
        const responseBox = document.getElementById('responseBox');
        const thinkingText = document.getElementById('thinkingText');
        const errorBox = document.getElementById('errorBox');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                return;
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Conectado';
                errorBox.classList.remove('visible');
                console.log('Connected to rtassist');
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Desconectado';
                scheduleReconnect();
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                errorBox.textContent = 'Error de conexión';
                errorBox.classList.add('visible');
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'transcript':
                    addTranscript(msg.content, msg.speaker || 0);
                    break;
                case 'token':
                    addResponseToken(msg.content);
                    break;
                case 'thinking':
                    showThinking(msg.content);
                    break;
                case 'error':
                    showError(msg.content);
                    break;
            }
        }

        function addTranscript(text, speaker = 0) {
            const timestamp = new Date().toLocaleTimeString('es-AR', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            
            let speakerClass = 'speaker-unknown';
            let speakerLabel = '';
            
            if (speaker > 0) {
                speakerClass = `speaker-${speaker}`;
                speakerLabel = `[S${speaker}] `;
            }
            
            const span = document.createElement('div');
            span.style.marginBottom = '8px';
            span.innerHTML = `<span class="timestamp">[${timestamp}]</span><span class="${speakerClass}">${speakerLabel}${escapeHtml(text)}</span>`;
            
            transcriptBox.appendChild(span);
            transcriptBox.scrollTop = transcriptBox.scrollHeight;
        }

        let responseText = '';

        function addResponseToken(token) {
            responseText += token;
            thinkingText.textContent = '';
            responseBox.innerHTML = `<span class="speaker-assistant">${escapeHtml(responseText)}</span>`;
            responseBox.scrollTop = responseBox.scrollHeight;
        }

        function showThinking(text) {
            thinkingText.textContent = text;
            responseBox.scrollTop = responseBox.scrollHeight;
        }

        function showError(text) {
            errorBox.textContent = text;
            errorBox.classList.add('visible');
        }

        function clearTranscript() {
            transcriptBox.innerHTML = '<span class="speaker-unknown">Esperando audio...</span>';
            responseBox.innerHTML = '<span class="thinking" id="thinkingText"></span>';
            responseText = '';
        }

        function scheduleReconnect() {
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
            }
            reconnectTimeout = setTimeout(connect, 3000);
        }

        function reconnect() {
            if (ws) {
                ws.close();
            }
            connect();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-connect on load
        connect();
    </script>
</body>
</html>
