<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 280px;
      padding: 15px;
      background: #1a1a1a;
      color: #fff;
    }
    .status {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .connected { background: #4CAF50; }
    .disconnected { background: #f44336; }
    .capturing { background: #2196F3; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .start {
      background: #4CAF50;
      color: white;
    }
    .start:hover { background: #45a049; }
    .start:disabled { background: #666; cursor: not-allowed; }
    .stop {
      background: #f44336;
      color: white;
    }
    .stop:hover { background: #da190b; }
    .info {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
    }
    .debug {
      font-size: 10px;
      color: #666;
      margin-top: 5px;
      word-break: break-all;
    }
    .tab-info {
      font-size: 11px;
      color: #aaa;
      margin-top: 8px;
      padding: 5px;
      background: #2a2a2a;
      border-radius: 3px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Loading...</span>
  </div>
  
  <div id="tabInfo" class="tab-info" style="display:none;"></div>
  
  <button id="startBtn" class="start">Start Capture</button>
  <button id="stopBtn" class="stop" style="display:none;">Stop Capture</button>
  
  <div id="debugInfo" class="debug"></div>
  
  <div class="info">
    1. Make sure Meet is open<br>
    2. Click "Start Capture"<br>
    3. rtassist will capture audio
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
